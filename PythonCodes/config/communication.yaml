# Communication System Configuration

# Server settings
server:
  host: localhost
  port: 8765
  max_connections: 1000
  connection_timeout: 30
  ping_interval: 30
  ping_timeout: 10

# Security settings
security:
  quantum_key_length: 256
  session_key_length: 32
  jwt_secret: "your-secret-key"
  jwt_expiry: 3600
  allowed_origins:
    - "http://localhost:3000"
    - "https://kapesit.org"
  rate_limit:
    requests_per_minute: 1000
    burst_size: 100

# Message queue settings
message_queue:
  max_retries: 3
  retry_delay: 5
  max_queue_size: 10000
  cleanup_interval: 3600
  message_ttl: 86400
  priority_levels:
    - name: "critical"
      value: 3
    - name: "high"
      value: 2
    - name: "normal"
      value: 1
    - name: "low"
      value: 0

# Performance settings
performance:
  max_message_size: 1048576  # 1MB
  compression_threshold: 1024  # 1KB
  batch_size: 100
  worker_count: 4
  buffer_size: 8192

# Logging settings
logging:
  level: "INFO"
  file: "communication.log"
  max_size: 10485760  # 10MB
  backup_count: 5
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

# Monitoring settings
monitoring:
  enabled: true
  metrics_interval: 60
  alert_thresholds:
    latency_ms: 100
    error_rate: 0.01
    queue_size: 1000
  alert_channels:
    - type: "email"
      recipients:
        - "admin@kapesit.org"
    - type: "slack"
      webhook: "https://hooks.slack.com/services/..."

# Feature flags
features:
  quantum_encryption: true
  message_compression: true
  message_batching: true
  rate_limiting: true
  monitoring: true
  alerts: true

# Custom settings
custom:
  debug_mode: false
  development: false
  environment: "production" 